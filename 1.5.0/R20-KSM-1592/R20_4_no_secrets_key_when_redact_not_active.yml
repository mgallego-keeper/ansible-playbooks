---
# R20.4: with keeper_redact only in callbacks_enabled (the default stdout callback prints the
# results), the keeper plugins do not add the _secrets key to the printed result (KSM-1592).
#
# Before the fix the plugins added _secrets whenever a module named keeper_redact was loaded,
# without checking which stdout callback was active, so the default callback printed the list
# of raw secrets.
#
# What this does: creates five throwaway records, runs kr_inner_get.yml as its own
# ansible-playbook process with ANSIBLE_STDOUT_CALLBACK=default and
# ANSIBLE_CALLBACKS_ENABLED=<keeper_redact> and -v (the default callback prints ok results only with -v), and runs kr_check.py with --skip-secret-values
# (the default callback is expected to print values; this test is only about _secrets) and
# --expect-plain-visible (control: results were printed and nothing redacted them).
# It removes the records whatever happens.
- name: "R20.4: no _secrets key is printed when keeper_redact is not the stdout callback"
  hosts: localhost
  connection: local
  gather_facts: false
  collections:
    - keepersecurity.keeper_secrets_manager

  vars:
    keeper_config_file: "{{ config_file }}"
    kr_tag: R20_4
    kr_callback: "{{ lookup('env', 'KR_CALLBACK') | default('keeper_redact' if (surface | default('pip')) == 'pip' else 'keepersecurity.keeper_secrets_manager.keeper_redact', true) }}"
    kr_secrets: "{{ lookup('file', playbook_dir ~ '/kr_secrets.json') | from_json }}"

  tasks:
    - name: Run the scenario and always clean up
      block:
        - name: Create the throwaway records
          include_tasks: kr_records_create.yml

        - name: Make a scratch directory for captured output
          tempfile:
            state: directory
            suffix: ksmv_r20_4
          register: kr_dir

        - name: Run the inner playbook with the default stdout callback and keeper_redact only enabled
          shell: >-
            {{ ap_path | default('/usr/local/bin/ansible-playbook' if (surface | default('pip')) in ['tower', 'awx'] else (ansible_playbook_python | dirname ~ '/ansible-playbook')) }} {{ playbook_dir }}/kr_inner_get.yml -v
            -e {{ {'keeper_config_file': config_file, 'kr_pw_uids': kr_pw_uids, 'kr_num_uid': kr_num_uid} | to_json | quote }}
            > {{ kr_dir.path }}/out.txt 2>&1
          environment:
            ANSIBLE_STDOUT_CALLBACK: default
            ANSIBLE_CALLBACKS_ENABLED: "{{ kr_callback }}"
            ANSIBLE_NOCOLOR: "1"
            ANSIBLE_INVENTORY_UNPARSED_FAILED: "False"
            KSM_CONFIG_SKIP_MODE_WARNING: "TRUE"
            OBJC_DISABLE_INITIALIZE_FORK_SAFETY: "YES"
          register: kr_run
          changed_when: false
          failed_when: false

        - name: Assert the inner run completed
          assert:
            that: kr_run.rc == 0
            fail_msg: "FAIL [R20.4 setup]: inner playbook exited {{ kr_run.rc }}"
            quiet: true

        - name: Check the captured output for the _secrets key
          command: >-
            {{ ansible_playbook_python }} {{ playbook_dir }}/kr_check.py
            {{ kr_dir.path }}/out.txt {{ playbook_dir }}/kr_secrets.json --skip-secret-values --expect-plain-visible
          register: kr_check
          changed_when: false
          failed_when: false

        - name: Assert no _secrets key was printed
          assert:
            that: kr_check.rc == 0
            success_msg: "PASS [R20.4]: {{ kr_check.stdout_lines | join(' | ') }}"
            fail_msg: "FAIL [R20.4]: {{ kr_check.stdout_lines | join(' | ') }}"

      always:
        - name: Remove the throwaway records
          include_tasks: kr_records_cleanup.yml

        - name: Remove the scratch directory
          file:
            path: "{{ kr_dir.path }}"
            state: absent
          when: kr_dir is defined and kr_dir.path is defined
