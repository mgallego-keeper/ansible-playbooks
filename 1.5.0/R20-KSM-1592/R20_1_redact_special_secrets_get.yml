---
# R20.1: keeper_redact hides keeper_get / keeper_get_record results for secrets with a
# double quote, a backslash, a newline, or non-ASCII characters, at default, -v and -vvv
# verbosity, and never prints the _secrets key (KSM-1592).
#
# Before the fix the callback serialized the result to JSON first and then replaced the raw
# secret in that text. JSON escapes quote, backslash, newline and non-ASCII characters, so
# the replace matched nothing and the secret printed in clear text, together with the
# _secrets list. Only a plain alphanumeric secret was masked.
#
# What this does: creates five throwaway records (plain, `pa"ss\word`, multiline fake PEM,
# `pässwörd-日本`, and a numeric field), runs kr_inner_get.yml as its own ansible-playbook
# process with keeper_redact as the stdout callback at three verbosity levels, and runs
# kr_check.py over each captured output. The check looks for every secret raw, as JSON text
# (ascii and unicode), as a Python repr, and for each PEM line, plus the _secrets key.
# It removes the records whatever happens. Override the callback name with KR_CALLBACK.
- name: "R20.1: keeper_redact masks special-character secrets from keeper_get and keeper_get_record"
  hosts: localhost
  connection: local
  gather_facts: false
  collections:
    - keepersecurity.keeper_secrets_manager

  vars:
    keeper_config_file: "{{ config_file }}"
    kr_tag: R20_1
    kr_callback: "{{ lookup('env', 'KR_CALLBACK') | default('keeper_redact' if (surface | default('pip')) == 'pip' else 'keepersecurity.keeper_secrets_manager.keeper_redact', true) }}"
    kr_secrets: "{{ lookup('file', playbook_dir ~ '/kr_secrets.json') | from_json }}"

  tasks:
    - name: Run the scenario and always clean up
      block:
        - name: Create the throwaway records
          include_tasks: kr_records_create.yml

        - name: Make a scratch directory for captured output
          tempfile:
            state: directory
            suffix: ksmv_r20_1
          register: kr_dir

        - name: Run the inner playbook with keeper_redact at default, -v and -vvv
          shell: >-
            {{ ap_path | default('/usr/local/bin/ansible-playbook' if (surface | default('pip')) in ['tower', 'awx'] else (ansible_playbook_python | dirname ~ '/ansible-playbook')) }} {{ playbook_dir }}/kr_inner_get.yml {{ item.flag }}
            -e {{ {'keeper_config_file': config_file, 'kr_pw_uids': kr_pw_uids, 'kr_num_uid': kr_num_uid} | to_json | quote }}
            > {{ kr_dir.path }}/out_{{ item.name }}.txt 2>&1
          environment:
            ANSIBLE_STDOUT_CALLBACK: "{{ kr_callback }}"
            ANSIBLE_NOCOLOR: "1"
            ANSIBLE_INVENTORY_UNPARSED_FAILED: "False"
            KSM_CONFIG_SKIP_MODE_WARNING: "TRUE"
            OBJC_DISABLE_INITIALIZE_FORK_SAFETY: "YES"
          loop:
            - {name: default, flag: ""}
            - {name: v, flag: "-v"}
            - {name: vvv, flag: "-vvv"}
          register: kr_runs
          changed_when: false
          failed_when: false

        - name: Assert the inner runs completed (a crashed run proves nothing)
          assert:
            that: item.rc == 0
            fail_msg: "FAIL [R20.1 setup]: inner playbook ({{ item.item.name }}) exited {{ item.rc }}"
            quiet: true
          loop: "{{ kr_runs.results }}"
          loop_control:
            label: "{{ item.item.name }}"

        - name: Check each captured output for leaked secrets
          command: >-
            {{ ansible_playbook_python }} {{ playbook_dir }}/kr_check.py
            {{ kr_dir.path }}/out_{{ item.name }}.txt {{ playbook_dir }}/kr_secrets.json --expect-marker
          loop:
            - {name: default}
            - {name: v}
            - {name: vvv}
          register: kr_checks
          changed_when: false
          failed_when: false

        - name: Assert no secret leaked at any verbosity
          assert:
            that: item.rc == 0
            success_msg: "PASS [R20.1 {{ item.item.name }}]: {{ item.stdout_lines | join(' | ') }}"
            fail_msg: "FAIL [R20.1 {{ item.item.name }}]: {{ item.stdout_lines | join(' | ') }}"
          loop: "{{ kr_checks.results }}"
          loop_control:
            label: "{{ item.item.name }}"

      always:
        - name: Remove the throwaway records
          include_tasks: kr_records_cleanup.yml

        - name: Remove the scratch directory
          file:
            path: "{{ kr_dir.path }}"
            state: absent
          when: kr_dir is defined and kr_dir.path is defined
