---
# R3.1: Create without shared_folder_uid
- name: "R3.1: Create without shared_folder_uid"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    keeper_config_file: "{{ config_file }}"

  tasks:
    - name: Attempt create without shared_folder_uid
      keeper_create:
        record_type: login
        title: "R3.1 No Folder"
        login: "test"
        password: "test"
      register: result
      ignore_errors: yes

    - name: Verify error
      assert:
        that:
          - result.failed
        success_msg: "PASS [R3.1]: Missing shared_folder_uid rejected — {{ result.msg | default('') | truncate(80) }}"
        fail_msg: "FAIL [R3.1]: Should have failed without shared_folder_uid"
