---
# R9.1: keeper_redact callback plugin — secrets masked in output
#
# Verifies the keeper_redact callback redacts sensitive keeper_* variables
# from Ansible output so they don't appear in logs, CI/CD, or AWX output.
#
# Approach: Run a playbook that registers keeper_* vars via debug, then use
# a shell wrapper to inspect the output for raw secret values.
#
# What the callback redacts (lowercase keeper_ prefix only):
#   keeper_config, keeper_client_id, keeper_private_key, keeper_app_key,
#   keeper_app_owner_public_key, keeper_private_key, etc.
# What it does NOT redact:
#   Keeper_nothing (capital K), non-keeper vars
#
# Source: repo tests/keeper_redact_test.py

- name: "R9.1: keeper_redact callback — secrets masked in output"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    keeper_config_file: "{{ config_file }}"
    # Canary values — these should NOT appear raw in Ansible output
    keeper_client_id: "REDACT_CANARY_CLIENT_ID_12345"
    keeper_private_key: "REDACT_CANARY_PRIVATE_KEY_67890"
    # This should NOT be redacted (capital K)
    Keeper_public_info: "NOT_SECRET_SHOULD_APPEAR"

  tasks:
    - name: Display keeper_client_id (callback should redact this)
      debug:
        var: keeper_client_id

    - name: Display keeper_private_key (callback should redact this)
      debug:
        var: keeper_private_key

    - name: Display Keeper_public_info (capital K — should NOT be redacted)
      debug:
        var: Keeper_public_info

    - name: Confirm plugin is responsive (keeper_info works with redaction active)
      keeper_info:
      register: info_result

    - name: Assert keeper_info succeeded with redaction callback active
      assert:
        that:
          - info_result.record_type_list is defined
          - info_result.record_type_list | length > 0
        success_msg: "PASS [R9.1]: keeper_info succeeded — redaction callback did not break plugin execution"
        fail_msg: "FAIL [R9.1]: keeper_info failed — redaction callback may have interfered"
