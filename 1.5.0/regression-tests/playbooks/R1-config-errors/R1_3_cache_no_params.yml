---
# R1.3: keeper_cache_records without uid or title
- name: "R1.3: keeper_cache_records without uid or title"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    keeper_config_file: "{{ config_file }}"

  tasks:
    - name: Generate cache secret
      keeper_password:
        length: 64
      register: cache_secret

    - name: Set cache secret
      set_fact:
        keeper_record_cache_secret: "{{ cache_secret.password }}"

    - name: Run cache_records with no params
      keeper_cache_records:
      register: result
      ignore_errors: yes

    - name: Verify error
      assert:
        that:
          - result.failed
          - "'uid and title are both blank' in result.msg | lower or 'blank' in result.msg | lower"
        success_msg: "PASS [R1.3]: Correctly rejected — {{ result.msg | truncate(80) }}"
        fail_msg: "FAIL [R1.3]: Should have failed"
