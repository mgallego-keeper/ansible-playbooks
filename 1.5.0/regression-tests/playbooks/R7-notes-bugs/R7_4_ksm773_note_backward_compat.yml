---
# R7.4: KSM-773 + KSM-780 regression — keeper_create notes param naming
#
# KSM-773 Bug: keeper_create used self._task.args.get("note") (singular) while
#              all other modules used "notes" (plural). Users passing notes: (plural)
#              had notes silently ignored.
# KSM-780 Fix: Added backward compat so old note: (singular) still works.
#
# This test verifies:
#   1. notes: (plural) — preferred form — attaches notes (KSM-773 fix)
#   2. notes: with multiline content — preserved (KSM-773)
#   3. notes: with special characters — preserved (KSM-773)
#   4. note: (singular) — deprecated but still accepted (KSM-780 backward compat)
#
# Source: 1.3.0/KSM-772/playbooks/06_notes_bug_verification.yml (KSM-773 section)
#         1.3.0/KSM-780/playbooks/01_ksm780_note_backward_compat.yml

- name: "R7.4: KSM-773/780 — keeper_create notes param backward compat"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    keeper_config_file: "{{ config_file }}"

  tasks:
    # KSM-773 Test 1: Create with notes: (plural) — the fix
    - name: "KSM-773.1 — Create with notes: (plural)"
      keeper_create:
        shared_folder_uid: "{{ shared_folder_uid }}"
        record_type: login
        title: "R7.4 Plural Notes - {{ now(fmt='%Y%m%d_%H%M%S') }}"
        fields:
          - type: login
            value: "r10_4_plural_user"
          - type: password
            value: "TestPwd123!"
        notes: "notes via plural parameter"
      register: plural_record

    - name: "KSM-773.1 — Read back notes"
      keeper_get:
        uid: "{{ plural_record.record_uid }}"
        notes: yes
      register: plural_readback

    - name: "KSM-773.1 — Assert notes: (plural) attached notes"
      assert:
        that:
          - plural_readback.value == "notes via plural parameter"
        success_msg: "PASS [R7.4a]: notes: (plural) correctly attached notes"
        fail_msg: "FAIL [R7.4a]: KSM-773 REGRESSION — notes: (plural) was ignored, got '{{ plural_readback.value | default('None') }}'"

    # KSM-773 Test 2: multiline notes preserved
    - name: "KSM-773.2 — Create with multiline notes: (plural)"
      keeper_create:
        shared_folder_uid: "{{ shared_folder_uid }}"
        record_type: login
        title: "R7.4 Multiline Notes - {{ now(fmt='%Y%m%d_%H%M%S') }}"
        fields:
          - type: login
            value: "r10_4_multiline_user"
          - type: password
            value: "TestPwd456!"
        notes: |
          Line 1: multiline notes test
          Line 2: KSM-773 regression
          Line 3: all lines preserved
      register: multiline_record

    - name: "KSM-773.2 — Read back multiline notes"
      keeper_get:
        uid: "{{ multiline_record.record_uid }}"
        notes: yes
      register: multiline_readback

    - name: "KSM-773.2 — Assert all lines preserved"
      assert:
        that:
          - "'Line 1' in multiline_readback.value"
          - "'Line 2' in multiline_readback.value"
          - "'Line 3' in multiline_readback.value"
        success_msg: "PASS [R7.4b]: Multiline notes preserved"
        fail_msg: "FAIL [R7.4b]: Multiline notes not preserved — got '{{ multiline_readback.value | default('None') }}'"

    # KSM-773 Test 3: special characters preserved
    - name: "KSM-773.3 — Create with special character notes"
      keeper_create:
        shared_folder_uid: "{{ shared_folder_uid }}"
        record_type: login
        title: "R7.4 Special Chars Notes - {{ now(fmt='%Y%m%d_%H%M%S') }}"
        fields:
          - type: login
            value: "r10_4_special_user"
          - type: password
            value: "TestPwd789!"
        notes: "Special chars: !@#$%^&*() and 'single quotes' and <angle>"
      register: special_record

    - name: "KSM-773.3 — Read back special char notes"
      keeper_get:
        uid: "{{ special_record.record_uid }}"
        notes: yes
      register: special_readback

    - name: "KSM-773.3 — Assert special chars preserved"
      assert:
        that:
          - "'!@#$%' in special_readback.value"
          - "'single quotes' in special_readback.value"
          - "'<angle>' in special_readback.value"
        success_msg: "PASS [R7.4c]: Special characters preserved in notes"
        fail_msg: "FAIL [R7.4c]: Special chars not preserved — got '{{ special_readback.value | default('None') }}'"

    # KSM-780 Test: old note: (singular) parameter — backward compat must hold
    - name: "KSM-780 — Create with deprecated note: (singular)"
      keeper_create:
        shared_folder_uid: "{{ shared_folder_uid }}"
        record_type: login
        title: "R7.4 Singular Note Compat - {{ now(fmt='%Y%m%d_%H%M%S') }}"
        fields:
          - type: login
            value: "r10_4_singular_user"
          - type: password
            value: "TestPwd000!"
        note: "backward compat via singular note param"
      register: singular_record

    - name: "KSM-780 — Read back notes from singular-param record"
      keeper_get:
        uid: "{{ singular_record.record_uid }}"
        notes: yes
      register: singular_readback
      ignore_errors: true

    - name: "KSM-780 — Assert note: (singular) is accepted"
      assert:
        that:
          - singular_readback is not failed
          - singular_readback.value == "backward compat via singular note param"
        success_msg: "PASS [R7.4d]: note: (singular) backward compat works — KSM-780 confirmed"
        fail_msg: "FAIL [R7.4d]: KSM-780 REGRESSION — note: (singular) broken, got '{{ singular_readback.value | default('None/failed') }}'"

    # Cleanup
    - name: Cleanup all test records
      keeper_remove:
        uid: "{{ item }}"
      loop:
        - "{{ plural_record.record_uid }}"
        - "{{ multiline_record.record_uid }}"
        - "{{ special_record.record_uid }}"
        - "{{ singular_record.record_uid }}"
      ignore_errors: yes
