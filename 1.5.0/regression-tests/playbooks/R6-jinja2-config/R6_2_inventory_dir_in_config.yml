---
# R6.2: Jinja2 {{ inventory_dir }} in keeper_config_file
# Regression for KSM-781: alternative Jinja2 expression form
# Source: 1.3.0/KSM-781/playbooks/02_ksm781_jinja2_variations.yml (Test 4)
# QA setup: none beyond the variables. The playbook copies `config_file` to a temporary file named with the
# templated path under test (so the path expansion is what is exercised) and removes it afterward.

- name: "R6.2: Jinja2 inventory_dir in keeper_config_file"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    keeper_config_file: "{{ inventory_dir }}/../.r6_2_config.json"

  tasks:
    - name: Make sure the directory in the templated path exists
      file:
        path: "{{ keeper_config_file | dirname }}"
        state: directory

    - name: Write a temporary config at the templated path under test
      copy:
        src: "{{ config_file }}"
        dest: "{{ keeper_config_file }}"
        remote_src: yes
        mode: "0600"
      no_log: true

    - block:
      - name: Assert inventory_dir config path resolved
        assert:
          that:
            - keeper_config_file is not search('\{\{')
          success_msg: "PASS [R6.2a]: Resolved to {{ keeper_config_file }}"
          fail_msg: "FAIL [R6.2a]: Raw Jinja2 still in path: {{ keeper_config_file }}"

      - name: Connect via keeper_info ({{ inventory_dir }} config path)
        keeper_info:
        register: info_result

      - name: Assert plugin connected
        assert:
          that:
            - info_result.record_type_list is defined
            - info_result.record_type_list | length > 0
          success_msg: "PASS [R6.2b]: keeper_info succeeded with {{ '{{' }} inventory_dir {{ '}}' }} config path"
          fail_msg: "FAIL [R6.2b]: keeper_info failed — {{ '{{' }} inventory_dir {{ '}}' }} not resolved"

      always:
        - name: Remove the temporary config
          file:
            path: "{{ keeper_config_file }}"
            state: absent
