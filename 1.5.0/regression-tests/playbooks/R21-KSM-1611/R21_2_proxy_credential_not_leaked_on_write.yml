---
# R21.2: a malformed proxy URL must not leak the proxy credential on the WRITE path
# (KSM-1611). Save/delete/create/folder calls route through the plain post_function, a
# separate code path from the custom_post_function used for cached reads — the ticket
# explicitly calls out that a fix covering only the read path would miss this. This case
# uses delete_secret(), which goes straight to post_function with no prior read, so it is
# a clean, direct hit on the write-path route under test.
#
# Same embedded-process technique as R21.1 (see that file's header for why). The record is
# created over a clean network, then a real delete is attempted under the malformed proxy
# — if the fix is working the delete never reaches the server, so the record is still
# there afterward, and cleanup deletes it for real over a clean network.

- name: "R21.2: proxy credential is not leaked in the task message on the write path"
  hosts: localhost
  connection: local
  gather_facts: false
  collections:
    - keepersecurity.keeper_secrets_manager

  vars:
    keeper_config_file: "{{ config_file }}"

  tasks:
    - name: Create a throwaway record to attempt to delete under the malformed proxy
      keeper_create:
        shared_folder_uid: "{{ shared_folder_uid }}"
        record_type: login
        title: "R21.2 Write Target - {{ now(fmt='%Y%m%d_%H%M%S') }}"
        fields:
          - type: login
            value: "r21_2_original_value"
      register: created
      no_log: true

    - name: Assert the throwaway record was really created
      assert:
        that:
          - created.changed
          - created.record_uid is defined and created.record_uid is not none
        success_msg: "PASS [R21.2 setup]: throwaway record created"
        fail_msg: "FAIL [R21.2 setup]: throwaway record was not created — {{ created }}"

    - name: Run the checks, then clean up by exact UID whatever happens
      block:
        - name: Run the real proxy-leak check against live QA CA (write mode, own process)
          command: >
            {{ ansible_playbook_python }}
            {{ playbook_dir }}/proxy_leak_check.py
            {{ config_file }} {{ created.record_uid }} write
          environment:
            PYTHONPATH: "{{ '/usr/share/ansible/collections' if (surface | default('pip')) in ['tower', 'awx'] else (lookup('env', 'PYTHONPATH')) }}"
          register: leak_check
          changed_when: false

        - name: Assert the leak check passed (write failed cleanly, no credential, real exit code)
          assert:
            that:
              - leak_check.rc == 0
              - "'PASS' in leak_check.stdout"
              - "'u:p' not in leak_check.stdout"
            success_msg: "PASS [R21.2]: {{ leak_check.stdout }}"
            fail_msg: "FAIL [R21.2]: rc={{ leak_check.rc }} stdout={{ leak_check.stdout }} stderr={{ leak_check.stderr }}"

        - name: Confirm the record was NOT actually deleted by the failed malformed-proxy attempt
          keeper_get_record:
            uid: "{{ created.record_uid }}"
          register: still_exists
          no_log: true

        - name: Assert the write-under-malformed-proxy never reached the server
          assert:
            that:
              - not still_exists.failed
            success_msg: "PASS [R21.2]: record still exists — the failed write never reached the server"
            fail_msg: "FAIL [R21.2]: record is gone — the malformed-proxy delete somehow went through"

      always:
        - name: "Cleanup: remove the throwaway record for real, over a clean network"
          keeper_remove:
            uid: "{{ created.record_uid }}"
          ignore_errors: true
          no_log: true
