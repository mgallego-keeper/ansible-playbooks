---
# R39.2 (KSM-1643): verify R39_1's captured keeper_redact output never contains the short secret
#
# Runs R39_1 as a subprocess with keeper_redact as the stdout callback (-vvv prints every task result) and checks
# the captured stdout. A callback cannot be asserted from inside its own play, so the check runs on captured output.

- name: "R39.2: Verify keeper_redact masks a short secret in captured output"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    keeper_config_file: "{{ config_file }}"
    r39_1_playbook: "{{ playbook_dir }}/R39_1_short_secret_redaction.yml"
  tasks:
    - name: Run R39_1 playbook and capture output
      shell: |
        ansible-playbook -vvv "{{ r39_1_playbook }}" \
          -e config_file="{{ config_file }}" \
          -e short_secret_record_uid="{{ short_secret_record_uid }}"
      environment:
        ANSIBLE_CONFIG: "{{ playbook_dir }}/../../ansible.cfg"
        ANSIBLE_ACTION_PLUGINS: "{{ repo_path }}/keeper_secrets_manager_ansible/plugins/action"
        ANSIBLE_LOOKUP_PLUGINS: "{{ repo_path }}/keeper_secrets_manager_ansible/plugins/lookup"
        ANSIBLE_CALLBACK_PLUGINS: "{{ repo_path }}/keeper_secrets_manager_ansible/plugins/callback"
        ANSIBLE_MODULE_UTILS: "{{ repo_path }}/keeper_secrets_manager_ansible"
        ANSIBLE_LIBRARY: "{{ repo_path }}/keeper_secrets_manager_ansible/plugins/modules"
        ANSIBLE_STDOUT_CALLBACK: keeper_redact
        OBJC_DISABLE_INITIALIZE_FORK_SAFETY: "YES"
        KSM_CONFIG_SKIP_MODE_WARNING: "TRUE"
      register: r39_output
      no_log: true
      ignore_errors: true

    - name: Assert the inner run succeeded
      assert:
        that: r39_output.rc == 0
        success_msg: "PASS [R39.2a]: inner playbook succeeded with keeper_redact active"
        fail_msg: "FAIL [R39.2a]: inner playbook failed (rc={{ r39_output.rc }})"

    - name: Assert the short password is absent from output
      assert:
        that: "'~#q' not in r39_output.stdout and '~#q' not in r39_output.stderr"
        success_msg: "PASS [R39.2b]: short password absent from keeper_redact output"
        fail_msg: "FAIL [R39.2b]: REDACTION BROKEN — short password appeared in output"

    - name: Assert the redaction marker is present
      assert:
        that: "'****' in r39_output.stdout"
        success_msg: "PASS [R39.2c]: redaction marker present"
        fail_msg: "FAIL [R39.2c]: redaction marker missing"
