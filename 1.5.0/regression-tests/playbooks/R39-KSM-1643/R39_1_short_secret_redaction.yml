---
# R39.1 (KSM-1643): short secrets must be masked in the originating Keeper task under keeper_redact
#
# Inner playbook, run by R39_2 with ANSIBLE_STDOUT_CALLBACK=keeper_redact. Reads a record whose login is "record"
# (equal to the keeper_get_record payload key) and whose password is the 3-character string "~#q", then prints
# nothing else that contains the secret. Before the fix, the password appeared in the keeper_get_record result.
# Needs variables: short_secret_record_uid (login "record", password "~#q"; create it with create_seed_records.yml).
- name: "R39.1: keeper_get_record / keeper_get with a short secret and a colliding key"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    keeper_config_file: "{{ config_file }}"
  tasks:
    - name: Get the full record
      keeper_get_record:
        uid: "{{ short_secret_record_uid }}"
      register: rec

    - name: Get the password with allow_array
      keeper_get:
        uid: "{{ short_secret_record_uid }}"
        field: password
        allow_array: true
      register: pw_arr

    - name: Get login and password in a loop
      keeper_get:
        uid: "{{ short_secret_record_uid }}"
        field: "{{ item }}"
      loop: [login, password]
      register: looped

    - name: Registered results keep the original values
      assert:
        that:
          - rec.record.password == ['~#q']
          - pw_arr.value == ['~#q']
          - looped.results | map(attribute='value') | list == ['record', '~#q']
        success_msg: "PASS [R39.1]: registered values are unredacted"
        fail_msg: "FAIL [R39.1]: registered value altered"
      no_log: true
