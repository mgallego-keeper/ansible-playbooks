---
# R2.1: Get field from non-existent UID
- name: "R2.1: Get field from non-existent UID"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    keeper_config_file: "{{ config_file }}"

  tasks:
    - name: Get with invalid UID
      keeper_get:
        uid: "ZZZZZZZZZZZZZZZZZZZZZZ"
        field: login
      register: result
      ignore_errors: yes

    - name: Verify error handled
      assert:
        that:
          - result.failed
        success_msg: "PASS [R2.1]: Invalid UID handled gracefully — {{ result.msg | default('') | truncate(80) }}"
        fail_msg: "FAIL [R2.1]: Should have failed with invalid UID"
