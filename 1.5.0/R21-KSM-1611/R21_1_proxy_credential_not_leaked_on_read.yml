---
# R21.1: a malformed proxy URL must not leak the proxy credential on the READ path
# (KSM-1611). Before the fix, the request library's own parse error echoed the proxy
# userinfo verbatim, and the keeper lookup / keeper_get task message showed it.
#
# The malformed proxy is exported only inside a short-lived standalone Python process
# (proxy_leak_check.py), not via the task-level `environment:` keyword — confirmed during
# manual testing that these action-only plugins run in-process on the controller and do
# not route through `_execute_module`, so `environment:` on the task is silently ignored
# for them. Running the real check as its own process is the only way to scope the
# malformed proxy to just this one check without disturbing the rest of the run. This
# mirrors the embedded-script pattern already used elsewhere in this suite (R1/R2/R3/R8
# chdir to run embedded pytest).
#
# Self-contained: creates its own throwaway record over a clean network, runs the real
# check against live QA CA, then removes the record over a clean network again.

- name: "R21.1: proxy credential is not leaked in the task message on the read path"
  hosts: localhost
  connection: local
  gather_facts: false
  collections:
    - keepersecurity.keeper_secrets_manager

  vars:
    keeper_config_file: "{{ config_file }}"

  tasks:
    - name: Create a throwaway record to read back under the malformed proxy
      keeper_create:
        shared_folder_uid: "{{ shared_folder_uid }}"
        record_type: login
        title: "R21.1 Read Target - {{ now(fmt='%Y%m%d_%H%M%S') }}"
        fields:
          - type: login
            value: "r21_1_original_value"
      register: created
      no_log: true

    - name: Assert the throwaway record was really created
      assert:
        that:
          - created.changed
          - created.record_uid is defined and created.record_uid is not none
        success_msg: "PASS [R21.1 setup]: throwaway record created"
        fail_msg: "FAIL [R21.1 setup]: throwaway record was not created — {{ created }}"

    - name: Run the checks, then clean up by exact UID whatever happens
      block:
        - name: Run the real proxy-leak check against live QA CA (read mode, own process)
          command: >
            {{ ansible_playbook_python }}
            {{ playbook_dir }}/proxy_leak_check.py
            {{ config_file }} {{ created.record_uid }} read
          environment:
            PYTHONPATH: "{{ '/usr/share/ansible/collections' if (surface | default('pip')) in ['tower', 'awx'] else (lookup('env', 'PYTHONPATH')) }}"
          register: leak_check
          changed_when: false

        - name: Assert the leak check passed (task failed cleanly, no credential, real exit code)
          assert:
            that:
              - leak_check.rc == 0
              - "'PASS' in leak_check.stdout"
              - "'u:p' not in leak_check.stdout"
            success_msg: "PASS [R21.1]: {{ leak_check.stdout }}"
            fail_msg: "FAIL [R21.1]: rc={{ leak_check.rc }} stdout={{ leak_check.stdout }} stderr={{ leak_check.stderr }}"

      always:
        - name: "Cleanup: remove the throwaway record"
          keeper_remove:
            uid: "{{ created.record_uid }}"
          ignore_errors: true
          no_log: true
