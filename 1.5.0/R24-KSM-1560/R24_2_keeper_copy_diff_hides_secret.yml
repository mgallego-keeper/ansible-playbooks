---
# R24.2: keeper_copy with diff mode on shows a placeholder instead of the secret, in the diff and
# anywhere else in the task result (KSM-1560). Before the fix the "before" and "after" file text
# in the diff was the real secret.
#
# The record is created with a known value so the test can search the whole result for it, and it
# is removed whatever happens.
- name: "R24.2: keeper_copy diff output does not expose the secret"
  hosts: localhost
  connection: local
  gather_facts: false
  collections:
    - keepersecurity.keeper_secrets_manager

  vars:
    keeper_config_file: "{{ config_file }}"

  tasks:
    # now() is re-evaluated every time a variable is used, so freeze the values once here.
    - name: Fix the run tag, the secret value and the target file for this run
      set_fact:
        run_tag: "{{ now(fmt='%Y%m%d_%H%M%S') }}"
        secret_value: "r24-2-secret-{{ now(fmt='%Y%m%d%H%M%S') }}"
        diff_target: "/tmp/r24_2_diff_target_{{ now(fmt='%Y%m%d%H%M%S') }}"
      no_log: true

    - name: Create the fixture record with a known login value
      keeper_create:
        shared_folder_uid: "{{ shared_folder_uid }}"
        record_type: login
        title: "R24.2 Diff Fixture - {{ run_tag }}"
        generate_password: true
        fields:
          - type: login
            value: "{{ secret_value }}"
      register: fixture_record
      no_log: true

    - name: Run the checks, then clean up
      block:
        - name: Copy the login field to a local file with diff mode on
          keeper_copy:
            uid: "{{ fixture_record.record_uid }}"
            field: login
            dest: "{{ diff_target }}"
          diff: true
          register: copy_result
          no_log: true

        - name: Assert the real secret is nowhere in the task result
          assert:
            that:
              - "secret_value not in (copy_result | to_json)"
            success_msg: "PASS [R24.2]: the secret does not appear anywhere in the keeper_copy result"
            fail_msg: "FAIL [R24.2]: the real secret appears in the keeper_copy result (diff mode leaked it)"

        - name: Assert the diff shows the placeholder text
          assert:
            that:
              - "'the Keeper secret' in (copy_result.diff | default([]) | to_json)"
            success_msg: "PASS [R24.2]: the diff shows the placeholder in place of the secret"
            fail_msg: "FAIL [R24.2]: the diff does not show the expected placeholder -- got {{ copy_result.diff | default('no diff') }}"

        - name: Read the copied file back
          slurp:
            src: "{{ diff_target }}"
          register: copied_file
          no_log: true

        - name: Assert the file really holds the secret (the placeholder is display only)
          assert:
            that:
              - "(copied_file.content | b64decode) == secret_value"
            success_msg: "PASS [R24.2]: the copied file holds the real value, so only the display is hidden"
            fail_msg: "FAIL [R24.2]: the copied file does not hold the real value"
          no_log: true

      always:
        - name: Remove the fixture record
          keeper_remove:
            uid: "{{ fixture_record.record_uid }}"
          ignore_errors: yes
          no_log: true

        - name: Remove the copied file
          file:
            path: "{{ diff_target }}"
            state: absent
