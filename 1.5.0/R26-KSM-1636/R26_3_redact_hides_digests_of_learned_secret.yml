---
# R26.3: with keeper_redact as the stdout callback, a failing BUILT-IN copy of a secret that
# keeper_get learned does not print the SHA-1, MD5 or SHA-256 of that secret (KSM-1636).
#
# The built-in copy module returns "checksum", the SHA-1 of its content, in a failed result. The
# keeper_redact callback masked the secret itself but printed this SHA-1, because it only searched
# for the secret text. After the fix it also masks the SHA-1, MD5 and SHA-256 of each secret it
# learns. This applies to console output only.
#
# What this does: creates two throwaway records (a plain password and `pa"ss\word`), runs
# cd_inner_failing_builtin_copy.yml as its own ansible-playbook process, and reads the output:
#   - control run (default callback): the output holds the SHA-1 of each secret. This proves the
#     inner playbook really prints a digest, so a clean redacted run is meaningful.
#   - redacted run (keeper_redact): the copy still failed ("does not exist" in the output), the
#     mask "****" is there, and none of the SHA-1, MD5, SHA-256 or raw secret is printed.
# It removes the records whatever happens. Override the callback name with KR_CALLBACK.
- name: "R26.3: keeper_redact hides the digests of a learned secret when a built-in copy fails"
  hosts: localhost
  connection: local
  gather_facts: false
  collections:
    - keepersecurity.keeper_secrets_manager

  vars:
    keeper_config_file: "{{ config_file }}"
    kr_callback: "{{ lookup('env', 'KR_CALLBACK') | default('keeper_redact' if (surface | default('pip')) == 'pip' else 'keepersecurity.keeper_secrets_manager.keeper_redact', true) }}"

  tasks:
    - name: Fix a tag and the two secrets for this run
      set_fact:
        run_tag: "{{ now(fmt='%Y%m%d_%H%M%S') }}"
        r26_secrets:
          - "r26-3-plain-{{ now(fmt='%Y%m%d%H%M%S') }}"
          - 'pa"ss\word'

    - name: Run the checks, then clean up
      block:
        - name: Create the throwaway records
          keeper_create:
            shared_folder_uid: "{{ shared_folder_uid }}"
            record_type: login
            title: "R26.3 {{ idx }} - {{ run_tag }}"
            fields:
              - type: login
                value: "r26-3-user"
              - type: password
                value: "{{ item }}"
          loop: "{{ r26_secrets }}"
          loop_control:
            index_var: idx
            label: "secret {{ idx }}"
          register: made
          no_log: true

        - name: Run the inner playbook with the default callback (control)
          shell: >-
            {{ ap_path | default('/usr/local/bin/ansible-playbook' if (surface | default('pip')) in ['tower', 'awx'] else (ansible_playbook_python | dirname ~ '/ansible-playbook')) }} {{ playbook_dir }}/cd_inner_failing_builtin_copy.yml
            -e {{ {'keeper_config_file': config_file, 'cd_uids': made.results | map(attribute='record_uid') | list} | to_json | quote }}
            2>&1
          environment:
            ANSIBLE_STDOUT_CALLBACK: default
            ANSIBLE_NOCOLOR: "1"
            ANSIBLE_INVENTORY_UNPARSED_FAILED: "False"
            KSM_CONFIG_SKIP_MODE_WARNING: "TRUE"
            OBJC_DISABLE_INITIALIZE_FORK_SAFETY: "YES"
          register: control
          changed_when: false
          failed_when: false

        - name: Run the inner playbook with keeper_redact
          shell: >-
            {{ ap_path | default('/usr/local/bin/ansible-playbook' if (surface | default('pip')) in ['tower', 'awx'] else (ansible_playbook_python | dirname ~ '/ansible-playbook')) }} {{ playbook_dir }}/cd_inner_failing_builtin_copy.yml
            -e {{ {'keeper_config_file': config_file, 'cd_uids': made.results | map(attribute='record_uid') | list} | to_json | quote }}
            2>&1
          environment:
            ANSIBLE_STDOUT_CALLBACK: "{{ kr_callback }}"
            ANSIBLE_NOCOLOR: "1"
            ANSIBLE_INVENTORY_UNPARSED_FAILED: "False"
            KSM_CONFIG_SKIP_MODE_WARNING: "TRUE"
            OBJC_DISABLE_INITIALIZE_FORK_SAFETY: "YES"
          register: redacted
          changed_when: false
          failed_when: false

        - name: Assert both inner runs completed and the copies failed (a crashed run proves nothing)
          assert:
            that:
              - control.rc == 0
              - redacted.rc == 0
              - "'does not exist' in control.stdout"
              - "'does not exist' in redacted.stdout"
            success_msg: "PASS [R26.3 setup]: both inner runs completed and the copies failed"
            fail_msg: "FAIL [R26.3 setup]: inner runs rc={{ control.rc }}/{{ redacted.rc }}; last lines: {{ redacted.stdout_lines[-6:] }}"

        - name: Assert the control run printed the SHA-1 of each secret (the digest is really there to hide)
          assert:
            that:
              - (item | hash('sha1')) in control.stdout
            success_msg: "PASS [R26.3 control]: the default callback prints the SHA-1 of the content"
            fail_msg: "FAIL [R26.3 control]: the default callback did not print the SHA-1, so the redacted run proves nothing"
          loop: "{{ r26_secrets }}"
          loop_control:
            label: "secret"

        - name: Assert keeper_redact masked the output and printed no digest or raw secret
          assert:
            that:
              - "'****' in redacted.stdout"
              - (item | hash('sha1')) not in redacted.stdout
              - (item | hash('md5')) not in redacted.stdout
              - (item | hash('sha256')) not in redacted.stdout
              - item not in redacted.stdout
            success_msg: "PASS [R26.3]: keeper_redact printed no SHA-1, MD5, SHA-256 or raw value of the secret"
            fail_msg: "FAIL [R26.3]: keeper_redact output holds a digest or the raw value of a learned secret"
          loop: "{{ r26_secrets }}"
          loop_control:
            label: "secret"

      always:
        - name: Remove whatever throwaway records exist
          keeper_remove:
            uid: "{{ item.record_uid }}"
          loop: "{{ made.results | default([]) | selectattr('record_uid', 'defined') | list }}"
          loop_control:
            label: "{{ item.record_uid }}"
          ignore_errors: true
          no_log: true
